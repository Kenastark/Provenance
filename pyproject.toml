[project]
name = "provenance"
version = "0.2.0"
description = "An AI trust layer for environmental sensor networks."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandera>=0.20",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.1",
    "aiosqlite>=0.20",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.46",
    # shap pulls in numba/llvmlite; pin numba modern so the resolver never falls
    # back to an ancient llvmlite that predates Python 3.12 (it will otherwise, when
    # a newer numpy is already present and biases resolution).
    "numba>=0.60",
    # Phase-6 neural stack (HST-GAT). CPU-only in CI, MPS optional locally. The exact
    # working install on Apple Silicon is recorded in docs/decisions/0009-pyg-install.md;
    # torch-geometric is pure-Python here (no compiled torch-scatter/torch-sparse — PyG
    # falls back to torch.scatter_reduce, which is why this resolves and runs on arm64
    # macOS and on the Linux CI runner without a companion wheel index).
    "torch>=2.2,<2.9",
    "torch-geometric>=2.5,<2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "schemathesis>=3.27,<4",
    "httpx>=0.27",
    "ruff>=0.16,<0.17",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "freezegun>=1.5",
    "types-PyYAML",
    "pandas-stubs",
]

[project.scripts]
prov = "provenance.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]

# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
# N812: `from provenance.schema import canonical as C` is a deliberate, repo-wide
# alias for the canonical column-name namespace; the uppercase C reads as a
# constant namespace, not a class.
ignore = ["E501", "N812"]
# This is a scientific codebase: Greek letters carry their standard mathematical
# meaning (σ predictive std, α miscoverage rate, β attention-bias scale, Δθ the
# dispersion-cone gap, µ/π in the Gaussian NLL). They are intentional and legible, so
# the confusable-character check (RUF001/2/3) is told to allow exactly these.
allowed-confusables = ["σ", "α", "β", "µ", "μ", "π", "θ", "Δ", "ŷ", "·"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N803", "N806"]
# N803/N806: `X`, `Xp`, `X_ml` are the universal scikit-learn/LightGBM convention for a
# feature matrix (capital X, feature matrix; lowercase y, target). Using it keeps the
# model code readable to anyone who has touched an ML library; it is not a class name.
"src/provenance/models/**" = ["N803", "N806"]
"src/provenance/explain/**" = ["N803", "N806"]
# Detectors implement a fixed Protocol signature (frame, ctx); some do not use
# both arguments, which is correct, not dead code.
"src/provenance/detectors/**" = ["ARG002"]
# GCNBaseline.forward mirrors HSTGAT.forward's signature so the two are
# interchangeable behind a union type; the baseline has no attention, so it accepts
# and ignores `return_attention_step`. That is interface parity, not dead code.
"src/provenance/models/hstgat/model.py" = ["ARG002", "N803", "N806"]
# B008: `typer.Option(...)` in a parameter default is Typer's documented idiom for
# declaring CLI options; it is evaluated once at import, not per call.
"src/provenance/cli/main.py" = ["B008"]
# B008: `Depends(...)`/`Query(...)` in a parameter default is FastAPI's documented
# idiom. ARG001: framework-fixed signatures (route handlers' `request`/`_: Role`
# guard, the lifespan's `app`, exception handlers' `exc`) keep parameters the body
# may not reference. N818: ProblemException is the deliberate name for the RFC 7807
# carrier, clearer than a forced Error suffix next to the HTTP problem vocabulary.
"src/provenance/api/**" = ["B008", "ARG001", "N818"]
# The ingest adapters implement a fixed Protocol signature (discover/read take a
# root); an adapter that fails before using it is correct, not dead code. N818:
# SourceNotReady reads better without an Error suffix and sits beside SchemaDriftError.
"src/provenance/io/ingest/**" = ["ARG002", "N818"]

# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/provenance"]
plugins = []

[[tool.mypy.overrides]]
module = [
    "pandera.*",
    "lightgbm.*",
    "shap.*",
    "torch_geometric.*",
    "scipy.*",
    "sklearn.*",
    "joblib.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=src/provenance --cov-report=term-missing --cov-fail-under=88 -m 'not needs_docker and not slow'"
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated tests",
    "integration: crosses a module or service boundary",
    "property: hypothesis-driven invariants",
    "e2e: full stack",
    "slow: takes more than a few seconds",
    "needs_docker: requires the compose stack to be running",
    "demo_critical: guards something the competition demo depends on",
]
filterwarnings = ["default"]

[tool.coverage.run]
branch = true
source = ["src/provenance"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
