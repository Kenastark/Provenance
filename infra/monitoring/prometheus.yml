# Prometheus scrape configuration for Provenance — the INFRA plane only.
#
# This scrapes the API's /metrics endpoint (service health: up, request rate,
# latency, errors). It has nothing to do with model drift: that is a separate plane,
# served by the API at /v1/admin/model-drift and visualised by the model-drift Grafana
# dashboard. See docs/monitoring-v1.0-two-planes.md for why the two are kept apart.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: provenance-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: provenance-api
          plane: infra
