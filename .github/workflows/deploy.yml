name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: provenance-506423
  REGION: europe-west3
  REPO: europe-west3-docker.pkg.dev/provenance-506423/provenance
  WIF_PROVIDER: projects/941785006013/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOYER_SA: provenance-deployer@provenance-506423.iam.gserviceaccount.com

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - run: docker build -f infra/docker/api.Dockerfile -t ${{ env.REPO }}/api:${{ github.sha }} .
      - run: docker push ${{ env.REPO }}/api:${{ github.sha }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: provenance-api
          region: ${{ env.REGION }}
          image: ${{ env.REPO }}/api:${{ github.sha }}
          env_vars: |
            PROVENANCE_CORS_ORIGINS=https://www.provenancel2.com\,https://provenancel2.com

  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable
      - working-directory: apps/web
        run: pnpm install --no-frozen-lockfile
      - name: Fetch the real-streets basemap and label fonts (best-effort, ADR 0006/0011)
        # Both are gitignored and normally fetched once by a developer via `make
        # basemap`/`make fonts` (never committed - rule 10). CI has never run either,
        # so the deployed bundle has always shipped without them and the dashboard
        # has silently used the token-ground fallback in production. Non-fatal, same
        # as `make demo` treats these two targets: a transient failure to reach
        # build.protomaps.com must never break the deploy, it only costs the streets
        # (or their labels).
        run: |
          make basemap || echo "basemap: skipped — falling back to token ground"
          make fonts || echo "fonts: skipped — streets will show without labels"
      - working-directory: apps/web
        env:
          VITE_API_BASE_URL: https://api.provenancel2.com
        run: pnpm build
      - run: gcloud storage rsync apps/web/dist gs://${{ env.PROJECT_ID }}-provenance-web --recursive --delete-unmatched-destination-objects
      - run: gcloud compute url-maps invalidate-cdn-cache provenance-url-map --path="/*" --async
