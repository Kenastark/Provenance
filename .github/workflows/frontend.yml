name: frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "design/**"
      - "scripts/gen_frontend_contract.py"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "design/**"
      - "scripts/gen_frontend_contract.py"
      - "src/provenance/**"
      - ".github/workflows/frontend.yml"

# The contract drift check deliberately lives in ci.yml, which has no `paths:`
# filter, so it cannot be skipped by a change nobody thought to list here. What
# stays behind a filter is only the expensive browser work.

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests with the coverage gate
        run: pnpm test:coverage
      - run: pnpm build

  e2e:
    # The end-to-end suite runs against the real stack: Postgres, the demo corpus,
    # the audit, the API, and the built dashboard in a real browser. It is the only
    # place MapLibre's WebGL, real focus order, and the axe-core scan of a composed
    # page can be exercised.
    runs-on: ubuntu-latest
    services:
      db:
        # Deliberately the plain PostGIS image, NOT timescale/timescaledb-ha (which
        # local Compose still uses for its multi-arch Apple Silicon build). ADR 0012
        # dropped the Timescale dependency, but that claim is only worth anything if
        # something runs the migrations, the loader and the audit against an engine
        # where the extension does not exist. This service is that proof: on the
        # timescaledb-ha image the extension is present whether or not we ask for it,
        # so a hypertable creeping back in would go unnoticed. Here it cannot.
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: provenance
          POSTGRES_PASSWORD: provenance
          POSTGRES_DB: provenance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U provenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://provenance:provenance@localhost:5432/provenance
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Install project
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
        working-directory: apps/web
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Load the demo corpus and audit it
        run: make demo-data

      - name: Start the API
        # Deliberately `make api-bg`, the same target `make demo` uses, rather than a
        # hand-rolled uvicorn line. `make demo` once shipped without starting the API
        # at all and no test could notice, because CI started it its own way. CI now
        # exercises the documented path.
        #
        # 0.0.0.0, not the local default: the visual step runs the browser inside a
        # container and reaches back through the Docker bridge, which a loopback-only
        # listener refuses. On an ephemeral runner this binds nothing that outlives
        # the job.
        run: make api-bg API_HOST=0.0.0.0

      - name: End-to-end, accessibility and responsive
        run: |
          pnpm e2e --project=chromium e2e/demo-path.spec.ts e2e/accessibility.spec.ts
          pnpm e2e --project=mobile
        working-directory: apps/web

      - name: Free disk space for the Playwright image
        # The visual step pulls mcr.microsoft.com/playwright (~2GB uncompressed) on
        # a runner that has already taken uv, the project venv with torch, pnpm's
        # store, a Chromium install and the demo corpus. Twice in a row that pull
        # died on `no space left on device` mid-layer (update 24, PR #38), which
        # reads as a red e2e job caused by nothing in the diff. The hosted image
        # ships toolchains this repo never uses; reclaiming them costs seconds and
        # buys ~25GB. `|| true` throughout: this step must never itself fail the
        # job, and a path that is missing on a future runner image is not an error.
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift || true
          docker system prune -af --volumes || true
          echo "after:"; df -h /

      - name: Visual regression, in the pinned Playwright image
        # Not on the runner: a bare Ubuntu image and the official Playwright image
        # ship different font sets, so text metrics differ and a baseline generated
        # in one never matches a run in the other. The baselines are generated and
        # verified in the same container (`make web-visual-linux` / `-check`), which
        # is the only way this gate means anything.
        run: make web-visual-check

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
