# Everything this codebase assumes about the shape of the input data.
#
# This file exists so that assumptions are in ONE place and fail LOUDLY. The
# loader validates the real files against it and raises on drift rather than
# silently coercing. `prov schema observe` writes the observed schema next to
# this file so the two can be diffed.
#
# Rule: never invent a field name here. Names below were CONFIRMED by reading the
# real Green Sentinel export at phase 1 (`prov schema observe`), not assumed.

version: 1
status: confirmed

green_sentinel:
  cadence: hourly              # confirmed: timestamps step hourly, format YYYY-MM-DD-HH-MM
  window_days: 30              # confirmed: 2026-05-21 00:00 -> 2026-06-19 11:00 UTC
  expected_stations: 16        # confirmed: DEB-KER 01-15 and 18 (16 land stations)
  # One workbook per (station, domain); domain is encoded in the file name.
  # Hungarian domain tokens, confirmed from the export:
  file_domains:
    Levego: air               # "air"
    Felszin_alatti_viz: groundwater   # "subsurface water"
    Zaj: noise                # "noise"
  sheet_name: export           # confirmed: single sheet named "export" in every workbook
  # Column names are Hungarian and were read from the files, not invented:
  timestamp_column: timestamp        # confirmed; format "%Y-%m-%d-%H-%M"
  location_column: Location          # confirmed; carries site name + "(lat, lon)"
  # Location format CONFIRMED by reading all 16 workbooks at the phase-2 flag review:
  # "<site name> (<lat>, <lon>)" with decimal degrees, latitude first (Debrecen is
  # ~47.5 N, ~21.6 E). Parsed by io/loaders.parse_location, which fails loudly on any
  # other shape. Example: "ÉNYGÖ, BMW körút (47.577175, 21.502204)".
  location_format: "<name> (<lat>, <lon>)"
  location_status: confirmed
  # zone_type (urban/suburban/industrial/background) has NO source column in the
  # export — the only columns are timestamp/Location/parameter/value/unit. It is
  # populated from the CURATED, PROVISIONAL config/station_zones.yaml (human
  # classification from site names/coordinates), never inferred from the readings.
  zone_type_source: config/station_zones.yaml   # curated, provisional (needs expert sign-off)
  parameter_column: "Mérőeszköz"     # confirmed; holds the measured parameter name
  value_column: "érték"              # confirmed; the numeric reading
  unit_column: "mértékegység"        # confirmed; the declared unit string
  station_from: filename             # station id is the DEB-KERnn prefix of the file name
  # Parameters observed in the export (do not invent others; fail on unknown):
  known_parameters:
    - CO
    - CO2
    - Conductivity
    - Humidity
    - LAEQ nappali
    - "LAEQ éjszakai"
    - "NO"
    - NO2
    - NOx
    - O3
    - PM10
    - PM2.5
    - Pressure
    - TVOC
    - WaterLevel
    - WaterTemp
    - Wind_Direction
    - Wind_Speed
  known_structural_absences:
    - { station: DEB-KER15, missing: Wind_Direction, note: "station carries no wind sensors" }
    - { station: DEB-KER15, missing: Wind_Speed, note: "station carries no wind sensors" }
    - { station: DEB-KER02, missing: groundwater, note: "no Felszin_alatti_viz source file" }

enclod_traffic:
  cadence: 15min
  cumulative: true             # counters are cumulative and must be differenced, reset-aware
  # Enclod archive CSVs, one per month under "DKV databases/Enclod archive data".
  # Columns discovered at load time; status stays unconfirmed until read.
  timestamp_column: null
  counter_column: null
  value_column: null
  status: unconfirmed

weather:
  source: HungaroMet
  cadence: hourly
  wind_direction_units: degrees
  boundary_layer_height_available: null   # if false, use a documented time-of-day/season proxy

gtfs:
  source: "DKV via Volan Egyesules national feed"
  static: true
