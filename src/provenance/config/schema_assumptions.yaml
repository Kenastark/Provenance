# Everything this codebase assumes about the shape of the input data.
#
# This file exists so that assumptions are in ONE place and fail LOUDLY. The
# loader validates the real files against it and raises on drift rather than
# silently coercing. `prov schema observe` writes the observed schema next to
# this file so the two can be diffed.
#
# Rule: never invent a field name here. Names below were CONFIRMED by reading the
# real Green Sentinel export at phase 1 (`prov schema observe`), not assumed.
#
# Per-source `status` takes one of three values:
#   unconfirmed - nobody has looked; adapters must refuse to parse.
#   observed    - the real columns have been read and written down here, but the
#                 canonical mapping is not implemented yet. Adapters STILL refuse:
#                 knowing the shape is not the same as having parsed it.
#   confirmed   - observed AND mapped AND parsed. Adapters may read.
# Only `confirmed` opens the gate in io/ingest/*.read().

version: 2
status: confirmed

green_sentinel:
  cadence: hourly              # confirmed: timestamps step hourly, format YYYY-MM-DD-HH-MM
  window_days: 30              # confirmed: 2026-05-21 00:00 -> 2026-06-19 11:00 UTC
  expected_stations: 16        # confirmed: DEB-KER 01-15 and 18 (16 land stations)
  # One workbook per (station, domain); domain is encoded in the file name.
  # Hungarian domain tokens, confirmed from the export:
  file_domains:
    Levego: air               # "air"
    Felszin_alatti_viz: groundwater   # "subsurface water"
    Zaj: noise                # "noise"
  sheet_name: export           # confirmed: single sheet named "export" in every workbook
  # Column names are Hungarian and were read from the files, not invented:
  timestamp_column: timestamp        # confirmed; format "%Y-%m-%d-%H-%M"
  location_column: Location          # confirmed; carries site name + "(lat, lon)"
  parameter_column: "Mérőeszköz"     # confirmed; holds the measured parameter name
  value_column: "érték"              # confirmed; the numeric reading
  unit_column: "mértékegység"        # confirmed; the declared unit string
  station_from: filename             # station id is the DEB-KERnn prefix of the file name
  # Parameters observed in the export (do not invent others; fail on unknown):
  known_parameters:
    - CO
    - CO2
    - Conductivity
    - Humidity
    - LAEQ nappali
    - "LAEQ éjszakai"
    - "NO"
    - NO2
    - NOx
    - O3
    - PM10
    - PM2.5
    - Pressure
    - TVOC
    - WaterLevel
    - WaterTemp
    - Wind_Direction
    - Wind_Speed
  known_structural_absences:
    - { station: DEB-KER15, missing: Wind_Direction, note: "station carries no wind sensors" }
    - { station: DEB-KER15, missing: Wind_Speed, note: "station carries no wind sensors" }
    - { station: DEB-KER02, missing: groundwater, note: "no Felszin_alatti_viz source file" }

enclod_traffic:
  cadence: 15min
  cumulative: true             # counters are cumulative and must be differenced, reset-aware
  # Enclod archive CSVs, one per month under "DKV databases/Enclod archive data".
  #
  # STATUS: observed, not confirmed. The columns below were read from the real
  # archive (17 monthly files, ~1,533,668 rows, 42 counters). The canonical
  # mapping is DECIDED (see docs/decisions/0005-enclod-canonical-mapping.md) but
  # not implemented, so io/ingest/enclod.py still refuses to parse. Flipping this
  # to `confirmed` is the same change that wires the parse in - not a config edit
  # on its own.
  status: observed
  # The file is WIDE, not long: one row per (counter, 15-minute tick), carrying a
  # cumulative total for each vehicle class in its own column. The single
  # `counter_column` / `value_column` keys this block used to declare assumed a
  # narrow shape that does not exist; they are replaced by the pair below.
  timestamp_column: time            # observed; ISO-8601 with a trailing Z
  counter_id_column: uuid           # observed; 42 distinct values = the 42 counters
  counter_name_column: nick         # observed; e.g. "47.towards.Debrecen.far.IN"
  latitude_column: lat              # observed
  longitude_column: lng             # observed
  # Cumulative measure columns, stable across 2025-02 .. 2026-05 (16 files).
  measure_columns:
    - "cars_60+"
    - vans_opposite_direction
    - "vans_0-30"
    - "vans_30-60"
    - "vans_60+"
    - trucks_opposite_direction
    - "trucks_0-30"
    - "trucks_30-60"
    - "trucks_60+"
    - uncategorized
  # Unit is NOT declared anywhere in the source. Differencing a cumulative count
  # yields vehicles per 15-minute interval; that label is derived, not observed,
  # and is recorded here rather than invented at the call site (standing rule 2).
  derived_unit: vehicles/15min
  known_structural_absences:
    - { file: "2025/01.csv", missing: all_measure_columns,
        note: "carries only time/uuid/nick/lat/lng - a coverage fact (R19-shaped), not a defect" }
    - { class: cars, present: ["cars_60+"],
        note: "cars carries only the 60+ bucket; vans and trucks each carry four. Asymmetry is in the source, not in our read." }
  # Confirmed by profiling, and NOT yet reconciled with the competition brief:
  observed_quality_notes:
    duplicate_timestamps: "9,724 on cars_60+ alone across the 42 counters"
    nonmonotonic_runs: "63 on cars_60+"
    resets_found: 0            # brief expects ~80-96 per column; see ADR 0005
    dead_counters_found: 0     # brief expects 2; only cars_60+ was swept
    completeness_range: "0.24 .. 0.99 per counter"

weather:
  source: HungaroMet
  cadence: hourly
  wind_direction_units: degrees
  boundary_layer_height_available: null   # if false, use a documented time-of-day/season proxy

gtfs:
  source: "DKV via Volan Egyesules national feed"
  static: true
