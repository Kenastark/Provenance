# Station land-use zone classification.
#
# The Green Sentinel export has NO zone_type column (its only columns are
# timestamp/Location/parameter/value/unit). This file is a CURATED, PROVISIONAL
# classification of each station into urban / suburban / industrial / background,
# reasoned from the confirmed site name and coordinates in the Location column.
#
# IMPORTANT: this is human curation, not a measurement. It is provisional and needs
# a domain expert (or the municipality) to confirm before it drives anything beyond
# display. Each row carries the rationale it was assigned from and a confidence.
# Do NOT treat a zone as data-derived, and do not let it influence the defect rate
# or any physical detector.

