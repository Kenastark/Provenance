# Model hyperparameters and honesty thresholds for the phase-5 tree models.
#
# These are MODELLING CHOICES, not data-derived constants (standing rule 1). The
# defect rate, completeness, station counts and event verdicts are all computed
# from the readings and never appear here. Every figure below is a training or
# reporting knob, and this file is the single place to tune it.
#
# `status: provisional` — the LightGBM settings are sensible defaults, not the
# result of a held-out hyperparameter search; the recall floors and the R² band are
# reporting gates recorded in the model card, never quoted as accuracy in the pitch.

version: 1
status: provisional

deweather:
  # Weather-responsive pollutants to deweather. Intersected with what the corpus
  # actually carries at train time — a pollutant the network does not measure is
  # skipped, never invented. CO2 added per the real drop: it is the single most
  # common defect parameter in the confirmed export (schema_assumptions.yaml
  # `known_parameters`), and like CO/NO2/O3 its local concentration is driven by
  # dispersion conditions (boundary layer, wind), so it belongs in the same set.
  pollutants: [PM10, NO2, O3, CO, CO2]
  n_splits: 4                 # forward-chaining time-blocked folds
  # The R² sanity band (§ test gate). Below the floor, weather is not being captured
  # and the residual is just the raw value; above the ceiling, no unexplained signal
  # is left for a genuine event to show up in. Both are failures with distinct causes.
  r2_floor: 0.15
  r2_ceiling: 0.90
  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 30
    subsample: 0.9
    colsample_bytree: 0.9
    random_state: 20260907

fault:
  n_splits: 4
  # Per-signature recall floors at the injected strength. Recorded HERE and in the
  # model card, deliberately not in the pitch — with this few real positives a
  # headline number would describe the injection process, not the world (rule 4).
  recall_floors:
    flatline: 0.80
    drift: 0.55
    dropout: 0.80
    gain: 0.55
  # meteorological_artefact is the class we watch hardest: calling a real inversion
  # a fault is the most damaging error this system makes (§7.3), so its precision is
  # reported and floored separately.
  meteorological_artefact_precision_floor: 0.50
  lightgbm:
    n_estimators: 250
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    random_state: 20260907

explain:
  top_k: 3                    # features named in the operator sentence
  # SHAP additivity tolerance: sum(attributions)+base must reconstruct the model
  # output to within this (TreeExplainer is exact up to float error).
  reconstruction_tolerance: 1.0e-4

# --- HST-GAT (phase 6, §6.4) ------------------------------------------------
# The heterogeneous spatio-temporal graph attention model. Every figure here is an
# ARCHITECTURE / TRAINING choice, never a data-derived constant. The model is kept
# deliberately small: the binding constraint is 720 timesteps per station (§5.1), so
# a large model would memorise, not generalise. The parameter count is logged in the
# model card and justified there against that constraint.
hstgat:
  target_parameter: PM10      # the propagating pollutant the reconstruction targets;
                              # intersected with what the corpus carries (never invented)
  hidden_dim: 16              # GRU + attention hidden width; small on purpose
  attention_heads: 2          # heterogeneous attention heads per edge type
  # Wind-conditioned weight enters attention as an ADDITIVE pre-softmax BIAS, not a
  # hard mask, so the model can override the physical prior when the data warrants it.
  # beta scales the bias; beta = 0 recovers a plain HetGAT (tested). It is a learnable
  # parameter initialised here.
  wind_bias_beta_init: 1.0
  mask_fraction: 0.15         # fraction of observed values hidden for the masked-AE objective
  epochs: 200
  learning_rate: 0.01
  weight_decay: 1.0e-4
  min_variance: 1.0e-3        # floor on predicted variance (keeps Gaussian NLL finite)
  n_splits: 3                 # forward-chaining time blocks (train / calib / test-style)
  seed: 20260907
  device: cpu                 # cpu | mps ; cpu is the deterministic default (ADR 0009)

# --- Split conformal prediction (phase 6, §7.7) -----------------------------
# Wraps model outputs with a calibrated interval. The calibration set is ALWAYS a
# held-out TIME block, never a random sample (standing rule 7). alpha is the miscoverage
# rate: 0.1 -> a nominal 90% interval. The achieved empirical coverage is reported in
# the model card, not asserted as an accuracy figure.
conformal:
  alpha: 0.1                  # nominal miscoverage; 90% target coverage
  min_calibration: 20         # refuse to calibrate on fewer points than this (interval would be meaningless)
