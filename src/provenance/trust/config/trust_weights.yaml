# Trust Score v1 weights and parameters (blueprint §7.8).
#
# Trust(s,t) = w1·HealthConf
#            + w2·(1 − ImputationUncertainty)
#            + w3·CrossSensorConsistency
#            + w4·PhysicalPlausibility
#
# PROVENANCE OF THESE WEIGHTS: domain-expert elicitation, pending a logistic refit
# once labelled events exist (§7.8). They are NOT fitted. HealthConf and
# PhysicalPlausibility carry the most weight because they rest on deterministic,
# defensible signals (active defects, physical bounds); ImputationUncertainty is
# down-weighted because its term is an explicit placeholder until the phase-5
# imputation model lands.

version: 1
status: endorsed            # elicited | endorsed | fitted
endorsed_by: "project lead (kenastark)"
endorsed_on: "2026-08-08"
provenance: >-
  Domain-expert elicitation for the v1 statistics-only trust score, ENDORSED by the
  project lead on 2026-08-08 after reviewing the weights' behaviour on the network's
  documented real events (see endorsement_evidence). This is a governance sign-off on
  the elicited values for the demo, NOT a logistic refit — that still awaits labelled
  events (§7.8). Weights sum to 1.0.
endorsement_evidence: >-
  On the real Green Sentinel export (149,683 readings, 16 stations, 2026-05-21..06-19)
  the weights score the documented physical-impossibility event correctly: DEB-KER11's
  trust drops 0.577 -> 0.275 at the 4100.7 ug/m3 PM10 reading on 2026-06-02 20:00
  (PhysicalPlausibility -> 0, code T04), then recovers to ~0.565 once the event leaves
  the 7-day window. Frozen sensors (R12: 12,194 flags across 13 stations) and the NO
  detection-limit floor (R11: 2,111 flags) reproduce as expected.
endorsement_caveat: >-
  The point-in-time distribution is pessimistic and compressed on real data (all 16
  stations fall in ~0.26-0.58 at the window end) because the network genuinely carries
  pervasive frozen sensors and cross-sensor disagreement - on-message for "looks
  healthy, isn't", but it means discrimination lives in the trajectory (the series),
  not the snapshot. A logistic refit against labelled events should widen the spread.

weights:
  health_conf: 0.35             # w1: deterministic active-defect load
  imputation_certainty: 0.15    # w2: (1 − ImputationUncertainty); placeholder term
  cross_sensor_consistency: 0.20  # w3: agreement with neighbours
  physical_plausibility: 0.30   # w4: distance from physical bounds

health:
  # Trailing window over which active faults depress HealthConf.
  window_hours: 168            # one week
  # Severity weight carried by ONE DEFECTIVE CELL of each severity. Load is the
  # severity-weighted FRACTION of the station's cells that are defective:
  #   load = sum(worst_severity per defective cell) / covered cells in window
  # A cell counts once at its worst severity however many codes fired on it - the
  # same discipline the defect rate uses. Load is therefore bounded by 1.0 (every
  # cell critical) no matter how long the window is.
  severity_weights:
    critical: 1.0
    high: 0.7
    medium: 0.4
    low: 0.2
    info: 0.05
  # HealthConf = exp(-load / scale); scale sets how fast trust decays with load.
  decay_scale: 0.3
  basis: >-
    Anchored on the case the fault threshold has to catch: a sensor frozen across
    a station's whole record spoils 100% of its cells at high severity, so
    load = 0.7 and HealthConf = exp(-0.7/0.3) ~= 0.10. Such a station also scores 0
    on CrossSensorConsistency, putting total trust near 0.48 - below the 0.5 fault
    threshold in the design tokens, as a wholly frozen station must be. A station
    losing one of thirteen parameters carries load ~0.054 and stays near 0.84,
    which is the correct answer: twelve good channels are still good.
    SUPERSEDES v1.0, which summed one weight per flag ROW rather than per cell
    fraction. That made load scale with window length and flag volume, drove
    HealthConf to ~1e-30 for every station in the real network, and removed 35% of
    the trust score from play without failing a single test.

imputation:
  # Placeholder term. ImputationUncertainty is 1.0 for an absent reading and
  # decays toward 0 as neighbours covering the same parameter remain available.
  window_hours: 168
  neighbour_relief: 0.5        # max fraction of uncertainty a full neighbour set relieves
  basis: >-
    No imputation model exists in v1. Absence maps to maximum uncertainty, relieved
    only partially by neighbour availability, and the response flags the term as a
    placeholder so it is never mistaken for a calibrated confidence.

cross_sensor:
  window_hours: 168
  k_neighbours: 3              # k nearest stations sharing the parameter
  min_peers: 2                # below this, consistency is unavailable (T05), not 0
  basis: >-
    Spearman rank correlation against the k nearest peers sharing the parameter,
    over the trailing window; rank correlation is robust to the scale differences
    between stations. Nearest = geographic where coordinates exist, else all peers.

physical:
  # PhysicalPlausibility = clamped margin to the nearest physical bound. A reading
  # at the bound scores 0; one at or beyond scores 0; comfortably inside scores 1.
  safety_margin_fraction: 0.10
  basis: >-
    Distance from the physical bounds in thresholds.yaml, plus the cross-parameter
    (PM2.5 ≤ PM10) constraint. A reading within 10% of a bound is already partly
    implausible and scored below 1.

risk:
  # Risk = Trust × SeverityVsThreshold × PopulationExposure (§7.8).
  # PopulationExposure is stubbed at 1.0 until the GTFS feed lands (phase 7); the
  # response flags it as stubbed rather than silently defaulting.
  population_exposure_stub: 1.0
  basis: >-
    SeverityVsThreshold scales risk by how far the worst active defect's severity
    sits above nominal; PopulationExposure is a stub of 1.0 pending GTFS ridership.

scoring:
  # How trust is persisted over time. A load scores each station at a fixed cadence
  # across the ingest window, not just at the final instant, so /v1/trust/{id}?series
  # returns a real trajectory rather than a single point. The trailing window of each
  # component still governs how much history each score sees.
  cadence_hours: 24            # one score per station per day
  max_points: 120              # safety cap on scores per station per load
  basis: >-
    Daily cadence matches the operator cadence for a data-quality review and keeps a
    30-day load to ~30 scores per station. max_points bounds the cost of a long load.
