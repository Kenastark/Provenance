repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1200"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies:
          - "pydantic>=2.7"
          - "pydantic-settings>=2.3"
          - "types-PyYAML"
          - "pandas-stubs"
          - "numpy>=1.26"
          - "pandera>=0.20"
          - "typer>=0.12"
          - "rich>=13.7"
          - "jinja2>=3.1"
          - "fastapi>=0.111"
          - "sqlalchemy[asyncio]>=2.0"
          - "alembic>=1.13"
          - "structlog>=24.1"
          # torch ships its own stubs (py.typed) and the phase-6 model code subclasses
          # torch.nn.Module, so the hook env needs the real package or strict mypy sees
          # Module as Any and rejects the subclass. torch-geometric stays in
          # ignore_missing_imports (pyproject), so it is deliberately not listed here.
          - "torch>=2.2,<2.9"
        args: ["--config-file=pyproject.toml"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: no-raw-data
        name: block committing files under data/raw
        entry: bash -c 'echo "Refusing to commit raw data. See data/README.md"; exit 1'
        language: system
        files: '^data/(raw|interim|processed)/(?!.*\.gitkeep$).*'
